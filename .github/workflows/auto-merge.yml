name: Auto-merge claude PRs

# claude/* PRs can still auto-merge, but only after a human who is not the PR
# author has an approving review AND the required checks are green. A green CI
# run alone is not enough — that path was merging straight to main, and
# Cloudflare Pages deploys main, with nobody looking. PRs that modify the test
# suite, the build, or CI workflows still never auto-merge; those need a
# manual merge even after approval.
#
#   push to claude/foo → PR opens → CI green → human approves → auto-merge
#
# Required-check names live in REQUIRED_CHECKS below. If a check is missing
# OR not yet completed OR conclusion != "success", the PR is left alone.
# Any branch that does not start with claude/ is never merged here.

on:
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["Test", "Build anonscore.js"]
    types: [completed]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Skip if this fired from a PR that isn't claude/* (small optimisation)
    if: github.event_name != 'pull_request' || startsWith(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // "test" is the canonical gate: it builds, verifies the build is
            // in sync with source, runs the smoke + a11y + network checks, and
            // is required to run on every PR. "build" only triggers when
            // anonscore.jsx changes, so requiring it would block workflow-only
            // or doc-only PRs.
            const REQUIRED_CHECKS = ["test"];

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 50,
            });
            const candidates = prs.filter(p => p.head.ref.startsWith("claude/"));
            console.log(`Found ${candidates.length} open claude/* PR(s).`);

            const tryDeleteBranch = async (name) => {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${name}`,
                });
                console.log(`✓ Deleted branch ${name}`);
              } catch (e) {
                console.log(`Could not delete ${name}: ${e.message}`);
              }
            };

            for (const pr of candidates) {
              const tag = `#${pr.number} (${pr.head.ref})`;
              if (pr.draft) { console.log(`Skip ${tag}: draft`); continue; }
              if (pr.mergeable_state === "dirty") { console.log(`Skip ${tag}: conflicts`); continue; }

              // Safety: never hands-free-merge a PR that modifies its own gate.
              // A PR touching the test suite, the build, or CI workflows could
              // weaken/disable the very checks that guard main — require a human.
              const { data: prFiles } = await github.rest.pulls.listFiles({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr.number, per_page: 100,
              });
              const guarded = prFiles.some(f => /^(scripts\/test\.mjs|build\.mjs|\.github\/)/.test(f.filename));
              if (guarded) { console.log(`Skip ${tag}: modifies the merge gate (test/build/CI) — needs human review`); continue; }

              const { data: { check_runs } } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });
              const byName = {};
              for (const r of check_runs) byName[r.name] = r;
              const missing = REQUIRED_CHECKS.filter(n => !byName[n]);
              if (missing.length) { console.log(`Skip ${tag}: required checks missing: ${missing.join(", ")}`); continue; }
              const failing = REQUIRED_CHECKS.filter(n => byName[n].status !== "completed" || byName[n].conclusion !== "success");
              if (failing.length) { console.log(`Skip ${tag}: required checks not green: ${failing.map(n => `${n}=${byName[n].status}/${byName[n].conclusion}`).join(", ")}`); continue; }

              // A green check is not approval. Require a non-author human
              // review whose latest state is APPROVED. Bots and the PR author
              // do not count; a later CHANGES_REQUESTED from the same person
              // replaces an earlier approval.
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const latestByUser = new Map();
              for (const rev of reviews) {
                const login = rev.user && rev.user.login;
                if (!login || login === (pr.user && pr.user.login) || login.endsWith("[bot]")) continue;
                latestByUser.set(login, rev.state);
              }
              if (![...latestByUser.values()].includes("APPROVED")) {
                console.log(`Skip ${tag}: needs an approving review from someone other than the author`);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: "merge",
                });
                console.log(`✓ Merged ${tag}`);
              } catch (e) {
                console.log(`Skip ${tag}: merge failed: ${e.message}`);
                continue;
              }
              await tryDeleteBranch(pr.head.ref);
            }

            // Sweep stale branches: any claude/* branch whose tip commit is
            // already reachable from main (i.e. merged) but the branch still
            // exists. Catches both pre-workflow buildup AND post-merge cases
            // where the in-line delete above failed transiently.
            const { data: branches } = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const mainSha = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            })).data.object.sha;
            const openPrBranches = new Set(prs.map(p => p.head.ref));
            for (const b of branches) {
              if (!b.name.startsWith("claude/")) continue;
              if (openPrBranches.has(b.name)) continue;  // Don't touch open-PR branches
              try {
                const { data: cmp } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: mainSha,
                  head: b.commit.sha,
                });
                // If main is ahead-or-equal of branch tip, branch is already merged
                if (cmp.status === "behind" || cmp.status === "identical") {
                  await tryDeleteBranch(b.name);
                } else {
                  console.log(`Skip ${b.name}: not merged (status: ${cmp.status})`);
                }
              } catch (e) {
                console.log(`Skip ${b.name}: compare failed: ${e.message}`);
              }
            }
