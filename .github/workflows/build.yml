name: Build anonscore.js

# Recompiles anonscore.jsx -> anonscore.js on feature branches so the committed
# build never goes stale. main is updated only via PRs, which therefore always
# carry a fresh build (avoids pushing to the protected main branch directly).
on:
  push:
    branches-ignore: [main]
    # anonscore.jsx is the only file the compiler reads. sw.js is not an input
    # and is not rewritten: the service worker uses stale-while-revalidate, so
    # there is no per-build cache key to stamp.
    paths: ["anonscore.jsx", "build.mjs"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Credentials stay off during npm run build. A branch's build.mjs must
      # not be able to push. The token is attached only for the commit step.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Commit rebuilt anonscore.js if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # build.mjs regenerates anonscore.js only. It does not touch sw.js
          # (no cache-key stamp — freshness is stale-while-revalidate).
          if git diff --quiet -- anonscore.js; then
            echo "anonscore.js already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add anonscore.js
            git commit -m "build: recompile anonscore.js [skip ci]"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi
