name: Test

# End-to-end safety net on every PR. Catches the kinds of regressions that
# previously slipped through: the May disaster (source file emptied), the broken
# PNG export (wrong SRI hash), CDN creep, console errors, a11y regressions.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Verify build is up-to-date
        run: |
          # build.mjs rewrites anonscore.js only. sw.js must stay untouched —
          # the service worker is stale-while-revalidate and has no per-build
          # cache key to stamp.
          if ! git diff --quiet -- anonscore.js sw.js; then
            echo "::error::Build output drifted. anonscore.js must match source (run 'npm run build' and commit it). sw.js must not change."
            git --no-pager diff anonscore.js sw.js | head -60
            exit 1
          fi
      - name: Run test suite
        run: npm test
